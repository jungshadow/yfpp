        <script type="text/javascript">
            // Single Page Apps for GitHub Pages
            // MIT License
            // https://github.com/rafgraph/spa-github-pages
            (function(l) {
                if (l.search[1] === '/') {
                    var decoded = l.search
                        .slice(1)
                        .split('&')
                        .map(function(s) {
                            return s.replace(/~and~/g, '&');
                        })
                        .join('?');
                    window.history.replaceState(
                        null,
                        null,
                        l.pathname.slice(0, -1) + decoded + l.hash
                    );
                }
            })(window.location);
        </script>

    <body>
        <noscript> You need to enable JavaScript to run this app. </noscript>

        <div id="root"></div>

        <script type="module" src="/src/index.tsx"></script>

        <script>
            // Error recovery: if the main script fails to load (stale cache),
            // reload once to fetch fresh assets.
            window.addEventListener('error', function(e) {
                if (
                    e.target &&
                    (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') &&
                    !sessionStorage.getItem('yfpp_reload')
                ) {
                    sessionStorage.setItem('yfpp_reload', '1');
                    window.location.reload();
                }
            }, true);
            // Clear the reload guard on successful load
            window.addEventListener('load', function() {
                sessionStorage.removeItem('yfpp_reload');
            });
        </script>
